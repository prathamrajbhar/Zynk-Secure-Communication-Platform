# ============================================================================
# PostgreSQL Production Configuration — Zynk
#
# Tuned for a 4GB RAM, 2 CPU server handling ~10K concurrent connections.
# Adjust shared_buffers, work_mem, etc. for your actual hardware.
# ============================================================================

# Connection Settings
listen_addresses = '*'
max_connections = 200
superuser_reserved_connections = 3

# Memory Settings
shared_buffers = 1GB                    # 25% of total RAM
effective_cache_size = 3GB              # 75% of total RAM
work_mem = 16MB                         # Per-operation memory
maintenance_work_mem = 256MB            # For VACUUM, CREATE INDEX
huge_pages = try

# Write-Ahead Log (WAL)
wal_level = replica                     # For streaming replication
max_wal_senders = 3                     # Number of replicas
max_replication_slots = 3
wal_keep_size = 1GB
wal_buffers = 64MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'

# Query Planner
random_page_cost = 1.1                  # SSD storage
effective_io_concurrency = 200          # SSD storage
default_statistics_target = 100

# Parallel Queries
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# Logging
log_destination = 'stderr'
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 200        # Log queries slower than 200ms
log_line_prefix = '%m [%p] %u@%d '
log_statement = 'ddl'                   # Log DDL statements
log_temp_files = 0                      # Log all temp files
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

# Autovacuum
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.05   # More aggressive than default 0.2
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.025

# Security
ssl = off                               # SSL handled by Nginx
password_encryption = scram-sha-256

# Locale
timezone = 'UTC'
lc_messages = 'en_US.utf8'
