# ============================================================================
# Zynk — Production Docker Compose
#
# Includes:
# - Application services (server, web)
# - Data stores (PostgreSQL, Redis)
# - Monitoring stack (Prometheus, Grafana, Loki)
# - Reverse proxy (Nginx)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
# ============================================================================

services:
  # ======================== Reverse Proxy ========================
  nginx:
    image: nginx:alpine
    container_name: zynk-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - zynk-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ======================== Backend API ========================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: zynk-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8000"
      DATABASE_URL: postgresql://zynk:${DB_PASSWORD}@postgres:5432/zynk?sslmode=prefer
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://zynk.example.com}
      DB_POOL_MAX: "30"
      DB_POOL_MIN: "5"
      LOG_LEVEL: info
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zynk-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ======================== Frontend ========================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: zynk-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-https://api.zynk.example.com}
      NEXT_PUBLIC_WS_URL: ${WS_URL:-wss://api.zynk.example.com}
    networks:
      - zynk-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ======================== Database ========================
  postgres:
    image: postgres:16-alpine
    container_name: zynk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zynk
      POSTGRES_USER: zynk
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Performance tuning
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - zynk-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zynk -d zynk"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ======================== Redis ========================
  redis:
    image: redis:7-alpine
    container_name: zynk-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - zynk-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ======================== Prometheus ========================
  prometheus:
    image: prom/prometheus:latest
    container_name: zynk-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - zynk-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  # ======================== Grafana ========================
  grafana:
    image: grafana/grafana:latest
    container_name: zynk-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_SERVER_ROOT_URL: https://grafana.zynk.example.com
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    networks:
      - zynk-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ======================== Loki (Log Aggregation) ========================
  loki:
    image: grafana/loki:latest
    container_name: zynk-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - zynk-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

networks:
  zynk-network:
    driver: bridge
