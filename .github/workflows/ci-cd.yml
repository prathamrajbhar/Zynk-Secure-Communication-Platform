# ============================================================================
# Zynk — GitHub Actions CI/CD Pipeline
#
# Stages:
#   1. Lint & Type Check
#   2. Test (Unit + Integration)
#   3. Security Scan
#   4. Build Docker Images
#   5. Deploy to Staging (on main push)
#   6. Deploy to Production (on release tag)
#
# Features:
#   - Matrix builds (Node 20, 22)
#   - Caching (npm, Docker layers)
#   - Automated database migrations
#   - Container scanning (Trivy)
#   - Rollback on failure
# ============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository }}/server
  WEB_IMAGE: ghcr.io/${{ github.repository }}/web

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ======================== Lint & Type Check ========================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [server, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.package }}

      - name: Generate Prisma Client (server only)
        if: matrix.package == 'server'
        run: npx prisma generate
        working-directory: server

      - name: Type check
        run: npm run lint
        working-directory: ${{ matrix.package }}

  # ======================== Tests ========================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zynk_test
          POSTGRES_USER: zynk
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zynk -d zynk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: server

      - name: Run database migrations
        run: npx prisma migrate deploy
        working-directory: server
        env:
          DATABASE_URL: postgresql://zynk:test_password@localhost:5432/zynk_test

      - name: Run tests
        run: npm test -- --coverage --forceExit
        working-directory: server
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://zynk:test_password@localhost:5432/zynk_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-that-is-at-least-32-characters-long
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-that-is-at-least-32-characters-long

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: server/coverage
          flags: server

  # ======================== Security Scan ========================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: npm audit (server)
        run: npm audit --audit-level=high
        working-directory: server
        continue-on-error: true

      - name: npm audit (web)
        run: npm audit --audit-level=high
        working-directory: web
        continue-on-error: true

  # ======================== Build Docker Images ========================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - package: server
            context: ./server
            image_env: SERVER_IMAGE
          - package: web
            context: ./web
            image_env: WEB_IMAGE
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env[matrix.image_env] }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env[matrix.image_env] }}:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ======================== Deploy to Staging ========================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Run database migrations
        run: |
          kubectl run prisma-migrate-${{ github.sha }} \
            --image=${{ env.SERVER_IMAGE }}:main \
            --restart=Never \
            --env="DATABASE_URL=${{ secrets.DATABASE_URL_STAGING }}" \
            --command -- npx prisma migrate deploy
          kubectl wait --for=condition=complete --timeout=120s job/prisma-migrate-${{ github.sha }} || true
          kubectl delete pod prisma-migrate-${{ github.sha }} --ignore-not-found

      - name: Deploy to staging
        run: |
          kubectl set image deployment/zynk-server \
            server=${{ env.SERVER_IMAGE }}:main \
            -n zynk-staging
          kubectl set image deployment/zynk-web \
            web=${{ env.WEB_IMAGE }}:main \
            -n zynk-staging
          kubectl rollout status deployment/zynk-server -n zynk-staging --timeout=300s
          kubectl rollout status deployment/zynk-web -n zynk-staging --timeout=300s

      - name: Smoke test
        run: |
          STAGING_URL=${{ secrets.STAGING_URL }}
          for i in $(seq 1 5); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/api/health")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: status $STATUS, retrying..."
            sleep 10
          done
          echo "Smoke test failed"
          exit 1

  # ======================== Deploy to Production ========================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Run database migrations
        run: |
          kubectl run prisma-migrate-${{ steps.version.outputs.VERSION }} \
            --image=${{ env.SERVER_IMAGE }}:${{ steps.version.outputs.VERSION }} \
            --restart=Never \
            --env="DATABASE_URL=${{ secrets.DATABASE_URL_PRODUCTION }}" \
            --command -- npx prisma migrate deploy
          kubectl wait --for=condition=complete --timeout=120s job/prisma-migrate-${{ steps.version.outputs.VERSION }} || true

      - name: Blue-Green Deploy
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          
          # Deploy new version alongside old (green)
          kubectl set image deployment/zynk-server \
            server=${{ env.SERVER_IMAGE }}:${VERSION} \
            -n zynk
          kubectl set image deployment/zynk-web \
            web=${{ env.WEB_IMAGE }}:${VERSION} \
            -n zynk
          
          # Wait for rollout
          if ! kubectl rollout status deployment/zynk-server -n zynk --timeout=300s; then
            echo "Rollout failed, initiating rollback..."
            kubectl rollout undo deployment/zynk-server -n zynk
            kubectl rollout undo deployment/zynk-web -n zynk
            exit 1
          fi

      - name: Post-deploy health check
        run: |
          PROD_URL=${{ secrets.PRODUCTION_URL }}
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL/api/health/ready")
            if [ "$STATUS" = "200" ]; then
              echo "Production health check passed"
              exit 0
            fi
            echo "Attempt $i: status $STATUS, retrying..."
            sleep 15
          done
          echo "Production health check failed, rolling back..."
          kubectl rollout undo deployment/zynk-server -n zynk
          kubectl rollout undo deployment/zynk-web -n zynk
          exit 1
